    <path d="M 9 1 C 28 1, 48 0, 64 4" stroke="#cc785c" stroke-width="4.5"/>
    <path d="M 64 4 C 70 0, 74 -2, 76 -4" stroke="#cc785c" stroke-width="3"/>
