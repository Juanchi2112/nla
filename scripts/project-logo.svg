<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#0E0E10"/>

  <g transform="translate(500,500) scale(6.0)" stroke-linecap="round" fill="none">
    <!-- top-left dendrite + branches -->
    <path d="M -5 -4 C -16 -14, -22 -22, -26 -32" stroke="#cc785c" stroke-width="4.5"/>
    <path d="M -26 -32 C -30 -36, -32 -36, -34 -32" stroke="#cc785c" stroke-width="3"/>
    <path d="M -26 -32 C -22 -36, -22 -40, -20 -42" stroke="#cc785c" stroke-width="3"/>
    <!-- left dendrite + branches -->
    <path d="M -7 0 C -22 -2, -32 -2, -38 0" stroke="#cc785c" stroke-width="4.5"/>
    <path d="M -38 0 C -42 -3, -44 -3, -46 0" stroke="#cc785c" stroke-width="3"/>
    <path d="M -38 0 C -42 3, -44 3, -46 4" stroke="#cc785c" stroke-width="3"/>
    <!-- bottom-left dendrite + branches -->
