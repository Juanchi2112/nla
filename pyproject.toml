[project]
name = "nla"
version = "0.1.0"
description = "Natural Language Autoencoder monitoring stack — backend (orchestrator + in-process judge), GPU server, and frontend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Core runtime: backend service (Railway). Includes anthropic for the
# in-process ClaudeJudge — no separate judge_service deploy anymore.
dependencies = [
    "fastapi>=0.115,<0.140",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "anthropic>=0.40,<1",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
# GPU-side stack: gpu/server.py + gpu/scripts/*. Runs on vast.ai, NOT Railway.
gpu = [
    "torch",
    "transformers<5",
    "safetensors",
    "orjson",
    "numpy<2.0",
    "huggingface-hub",
    "pyarrow",
    "sglang[all]>=0.5.6",
]

# Dev tools: linting, formatting, testing.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

# ─── Tools ────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "gpu/nla_inference.py",  # vendored from kitft/nla-inference, leave intact (CLAUDE.md §9 rule 4)
    "frontend",              # JS/TS, not Python
    "gpu/examples",          # transcript files
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line length: handled by formatter, but tolerant for long strings/URLs
    "B008",  # function calls in argument defaults: FastAPI uses Depends(...) idiomatically
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # asserts allowed in tests
]
"gpu/scripts/*" = [
    "T201",  # print statements allowed in CLI scripts
]
"animation/*" = [
    "F403",  # manim's public API is designed for star imports
    "F405",  # names sourced from manim's star import
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
