# Railway config for the judge service.
# Service root in the dashboard should point at the repo root so the
# Dockerfile can COPY both judge_service/ and nla_judge/.

[build]
builder = "DOCKERFILE"
dockerfilePath = "judge_service/Dockerfile"

[deploy]
startCommand = "sh -c 'uvicorn judge_service.app:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
