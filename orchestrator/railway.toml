# Railway config for the orchestrator.
# Service root in the dashboard should point at the repo root so the
# Dockerfile can COPY orchestrator/.

[build]
builder = "DOCKERFILE"
dockerfilePath = "orchestrator/Dockerfile"

[deploy]
startCommand = "sh -c 'uvicorn orchestrator.app:app --host 0.0.0.0 --port ${PORT:-8001}'"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
