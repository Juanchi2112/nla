# Railway config for the backend (orchestrator + in-process judge).
# Service root in the Railway dashboard should point at repo root so the
# Dockerfile can COPY backend/ and read pyproject.toml + uv.lock.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "sh -c 'uv run uvicorn backend.app:app --host 0.0.0.0 --port ${PORT:-8001}'"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
